<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerli Milli Hesap</title>
    <!-- Favicon / Sekme Logosu -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- PWA Web App Manifest (Dinamik) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Yerli Milli Hesap","short_name":"HesapMakinesi","start_url":".","display":"standalone","background_color":"#090d16","theme_color":"#090d16","icons":[{"src":"logo.png","sizes":"192x192","type":"image/png"}]}'>
    <meta name="theme-color" content="#090d16">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        retro: ['"Press Start 2P"', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .font-mono-calc {
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- Theme Styling Rules --- */
        body.dark-theme {
            background-color: #090d16;
            color: #f8fafc;
        }
        body.dark-theme .calc-card {
            background-color: #1e293b;
            border-color: #334155;
        }
        body.dark-theme .calc-display {
            background-color: #0f172a;
        }

        body.cyber-theme {
            background-color: #0d0221;
            color: #00f0ff;
        }
        body.cyber-theme .calc-card {
            background-color: #150535;
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
        }
        body.cyber-theme .calc-display {
            background-color: #080114;
            border-bottom: 2px solid #00f0ff;
        }
        body.cyber-theme .calc-btn-num {
            background-color: #240954;
            color: #00f0ff;
        }
        body.cyber-theme .calc-btn-op {
            background-color: #ff007f;
            color: #ffffff;
        }

        body.light-theme {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        body.light-theme .calc-card {
            background-color: #ffffff;
            border-color: #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        body.light-theme .calc-display {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        body.light-theme #main-display {
            color: #0f172a;
        }
        body.light-theme .calc-btn-num {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        body.retro-theme {
            background-color: #c4cfa1;
            color: #1a2e05;
        }
        body.retro-theme .calc-card {
            background-color: #8c9e5e;
            border: 4px solid #4d5930;
        }
        body.retro-theme .calc-display {
            background-color: #9bbc0f;
            border: 3px inset #8bac0f;
            color: #0f380f;
        }
        body.retro-theme #main-display, body.retro-theme #expression-display {
            font-family: 'Press Start 2P', monospace;
            color: #0f380f !important;
        }

        .calc-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .calc-btn:active {
            transform: scale(0.94);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 9999px;
        }

        .history-drawer {
            transition: transform 0.3s ease-in-out;
        }
        .history-drawer.closed {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="dark-theme min-h-screen flex items-center justify-center p-4 sm:p-6 select-none font-sans">

    <!-- Background Music Element -->
    <audio id="bg-music" loop autoplay src="music.mp3"></audio>

    <div class="calc-card relative w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col my-auto transition-all duration-300">
        
        <!-- Top Control Bar -->
        <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-slate-700/50 text-slate-400 gap-2">
            
            <!-- App Logo & Title -->
            <div class="flex items-center space-x-2">
                <img src="logo.png" alt="Logo" class="w-6 h-6 rounded-full object-cover border border-slate-600" onerror="this.style.display='none'">
                <span class="text-xs font-bold tracking-wider uppercase text-slate-300">Yerli Milli Hesap</span>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center space-x-2">
                <!-- Theme Switcher Dropdown -->
                <select id="theme-select" title="Tema Seçin" class="bg-slate-900/60 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none cursor-pointer">
                    <option value="dark">🌙 Dark Slate</option>
                    <option value="cyber">⚡ Cyberpunk</option>
                    <option value="light">☀️ Minimal Light</option>
                    <option value="retro">📟 Retro</option>
                </select>

                <!-- Music Toggle Button -->
                <button id="toggle-music" title="Müziği Başlat / Durdur" class="p-1.5 rounded-lg hover:bg-slate-700/60 transition-colors focus:outline-none">
                    <i id="music-icon" class="fa-solid fa-music text-slate-400"></i>
                </button>

                <!-- History Toggle Button -->
                <button id="toggle-history" title="İşlem Geçmişi" class="p-1.5 rounded-lg hover:bg-slate-700/60 transition-colors focus:outline-none">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400"></i>
                </button>
            </div>
        </div>

        <!-- Mode Selector Bar -->
        <div class="bg-slate-900/40 px-5 py-2 border-b border-slate-700/40 flex justify-between items-center text-xs">
            <span class="text-slate-400 font-medium">Mod:</span>
            <select id="mode-select" class="bg-slate-800 text-slate-200 rounded-lg px-2 py-1 border border-slate-700 focus:outline-none cursor-pointer">
                <option value="calc">🧮 Standart Hesap</option>
                <option value="length">📏 Uzunluk Dönüştürücü</option>
                <option value="weight">⚖️ Ağırlık Dönüştürücü</option>
                <option value="temp">🌡️ Sıcaklık Dönüştürücü</option>
            </select>
        </div>

        <!-- SECTION 1: Standard / Scientific Calculator View -->
        <div id="calc-section" class="flex flex-col">
            <!-- Screen Display -->
            <div class="calc-display bg-slate-950 p-6 flex flex-col justify-end items-end min-h-[130px] text-right border-b border-slate-800 relative">
                <div id="expression-display" class="text-slate-400 text-sm font-mono-calc min-h-[1.5rem] overflow-x-auto w-full whitespace-nowrap opacity-80"></div>
                <div id="main-display" class="text-4xl sm:text-5xl font-mono-calc font-semibold text-white tracking-tight overflow-x-auto w-full whitespace-nowrap mt-1 leading-tight">
                    0
                </div>
            </div>

            <!-- Scientific Operations Row (Dynamically Displayed) -->
            <div id="scientific-grid" class="grid grid-cols-5 gap-1.5 p-3 bg-slate-900/60 border-b border-slate-700/40 hidden">
                <button onclick="applyScientificOp('sin')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">sin</button>
                <button onclick="applyScientificOp('cos')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">cos</button>
                <button onclick="applyScientificOp('tan')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">tan</button>
                <button onclick="applyScientificOp('sqrt')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">√</button>
                <button onclick="applyScientificOp('square')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">x²</button>
                <button onclick="applyScientificOp('log')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">log</button>
                <button onclick="applyScientificOp('ln')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">ln</button>
                <button onclick="applyScientificOp('pi')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">π</button>
                <button onclick="applyScientificOp('e')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">e</button>
                <button onclick="applyScientificOp('fact')" class="calc-btn p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-semibold">x!</button>
            </div>

            <!-- Standard Keypad Layout -->
            <div class="p-4 grid grid-cols-4 gap-2.5">
                <button data-action="clear" class="calc-btn p-3.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 font-semibold text-lg flex items-center justify-center focus:outline-none">AC</button>
                <button data-action="delete" class="calc-btn p-3.5 rounded-2xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 font-semibold text-lg flex items-center justify-center focus:outline-none"><i class="fa-solid fa-backspace"></i></button>
                <button data-action="percent" class="calc-btn p-3.5 rounded-2xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 font-semibold text-lg flex items-center justify-center focus:outline-none">%</button>
                <button data-operator="/" class="calc-btn calc-btn-op p-3.5 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xl flex items-center justify-center focus:outline-none">÷</button>

                <button data-number="7" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">7</button>
                <button data-number="8" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">8</button>
                <button data-number="9" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">9</button>
                <button data-operator="*" class="calc-btn calc-btn-op p-3.5 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xl flex items-center justify-center focus:outline-none">×</button>

                <button data-number="4" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">4</button>
                <button data-number="5" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">5</button>
                <button data-number="6" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">6</button>
                <button data-operator="-" class="calc-btn calc-btn-op p-3.5 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xl flex items-center justify-center focus:outline-none">−</button>

                <button data-number="1" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">1</button>
                <button data-number="2" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">2</button>
                <button data-number="3" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">3</button>
                <button data-operator="+" class="calc-btn calc-btn-op p-3.5 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xl flex items-center justify-center focus:outline-none">+</button>

                <button data-action="negate" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">±</button>
                <button data-number="0" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">0</button>
                <button data-action="decimal" class="calc-btn calc-btn-num p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-white font-medium text-xl flex items-center justify-center focus:outline-none">,</button>
                <button data-action="calculate" class="calc-btn p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xl flex items-center justify-center focus:outline-none shadow-lg shadow-blue-600/30">=</button>
            </div>
        </div>

        <!-- SECTION 2: Unit Converter View -->
        <div id="converter-section" class="p-6 flex flex-col space-y-4 hidden">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Girdi Miktarı</label>
                <input id="converter-input" type="number" value="1" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-xl font-mono-calc text-lg focus:outline-none focus:border-sky-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Kaynak Birim</label>
                    <select id="converter-from-unit" class="w-full bg-slate-900 border border-slate-700 text-slate-200 p-2.5 rounded-xl text-sm focus:outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Hedef Birim</label>
                    <select id="converter-to-unit" class="w-full bg-slate-900 border border-slate-700 text-slate-200 p-2.5 rounded-xl text-sm focus:outline-none"></select>
                </div>
            </div>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 mt-2">
                <span class="block text-xs text-slate-400">Dönüştürülen Sonuç</span>
                <div id="converter-result" class="text-2xl font-mono-calc font-bold text-sky-400 mt-1">0</div>
            </div>
        </div>

        <!-- History Overlay Drawer -->
        <div id="history-panel" class="history-drawer closed absolute inset-0 bg-slate-900/95 backdrop-blur-md z-20 flex flex-col p-5">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-sky-400"></i> İşlem Geçmişi
                </h3>
                <button id="close-history" class="p-2 text-slate-400 hover:text-white rounded-lg transition-colors focus:outline-none">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="history-list" class="flex-1 overflow-y-auto my-4 space-y-3 pr-1">
                <div class="text-center text-slate-500 mt-10 text-sm">Henüz işlem yapılmadı</div>
            </div>

            <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
                <button id="clear-history" class="text-xs text-rose-400 hover:text-rose-300 font-medium flex items-center gap-1 p-2 rounded-lg hover:bg-rose-500/10 transition-colors">
                    <i class="fa-regular fa-trash-can"></i> Geçmişi Temizle
                </button>
                <span class="text-xs text-slate-500">Tıklayarak sonucu kullanın</span>
            </div>
        </div>

    </div>

    <!-- External Scripts -->
    <script src="app.js"></script>
    <script src="app2.js"></script>
</body>
</html>
